      #selection { position: fixed; pointer-events: none; z-index: 9999; border: 1px dashed rgba(255,255,255,0.6); }
      #selection .handle { position: absolute; width: 28px; height: 28px; background: #E2232A; border-radius: 50%; border: 2px solid #e5e7eb; pointer-events: auto; display: grid; place-items: center; color: #e5e7eb; font-size: 14px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
      #selection .h-rotate { top: -14px; right: -14px; cursor: grab; }
      #selection .h-scale { bottom: -14px; right: -14px; cursor: nwse-resize; }
      #selection .bar { position: absolute; top: -40px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; }
      #selection .btn { pointer-events: auto; padding: 4px 8px; border-radius: 8px; background: #E2232A; border: 1px solid #e5e7eb; color: #e5e7eb; font-size: 12px; font-family: 'Lexend', sans-serif;}
      #preview-container {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      flex-direction: column;
    }

  <body>
    <div id="ar"></div>
    <div id="loaderOverlay" class="loader-overlay hidden" style="pointer-events: none;">
      <div class="spinner"></div>
      <p></p>
    </div>
    <div class="top">
      </div>
    <div class="bottom-bar">
      <div class="switch-bar">
        <div id="countdown-timer">00:30</div>
        <button id="photo-toggle-btn" class="switch-btn active">
            <img src="assets/AR Scene/Photo Icon.png" alt="Photo Mode">
            Photo
        </button>
        <button id="video-toggle-btn" class="switch-btn">
            <img src="assets/AR Scene/Video Icon.png" alt="Video Mode">
            Video
        </button>
      </div>
      <div class="bottom-buttons-container">
           <div class="switch-cam-container">
              <button id="add-btn" class="bottom-sheet-cam-btn">
                  <img src="assets/AR Scene/add sticker icon.png" alt="Switch Camera">
              </button>
          </div>
          <div class="capture-button-container">
              <button id="capture-btn" class="capture-btn"></button>
          </div>
          <div class="switch-cam-container">
              <button id="cam-btn" class="switch-cam-btn">
                  <img src="assets/AR Scene/switch camera icon.png" alt="Switch Camera">
              </button>
          </div>
      </div>
    </div>
  <div id="preview-container" class="hidden">
    <div class="blur-overlay"></div>
    <div class="preview-content">
      <div id="preview-frame">
        <img id="preview-image" style="display: none;">
        <video id="preview-video" controls autoplay muted playsinline style="display: none;"></video>
        <button id="close-button" class="close-btn">
          <img src="assets/AR Scene/close button.png" alt="Close">
        </button>
      </div>
      <div class="button-group">
        <button id="save-button" class="action-btn save-btn save-button-img hidden">
          <span>Save</span>
        </button>
        <button id="share-button" class="action-btn share-btn share-button-img hidden">
          <span>Share</span>
        </button>
      </div>
    </div>
  </div>
  <div class="overlay" id="overlaySheet">
 <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-header">
        <span class="sheet-title">Choose Sticker</span>
        <button class="close-btn" id="closeSheet">✕</button>
      </div>
      <div class="sheet-content">
      <div class="grid try">
          <button class="thumb" style="background-color: #60a5fa;" data-add="uploaded">
            <img src="/stickers/AFK.svg" alt="Uploaded Image" />
          </button>
          <button class="thumb" data-add="battery">
            <img src="/stickers/Battery.svg" alt="Battery" />
          </button>
          <button class="thumb" data-add="clouds">
            <img src="/stickers/Clouds.svg" alt="Clouds" />
          </button>
          <button class="thumb" data-add="detox">
            <img src="/stickers/Detox.svg" alt="Detox" />
          </button>
          <button class="thumb" data-add="dnd">
            <img src="/stickers/DND.svg" alt="DND" />
          </button>
          <button class="thumb" data-add="lightning">
            <img src="/stickers/Lightning.svg" alt="Lightning" />
          </button>
          <button class="thumb" data-add="crown">
            <img src="/stickers/Pixel Crown.svg" alt="Crown" />
          </button>
          <button class="thumb" data-add="heart">
            <img src="/stickers/Pixel Heart.svg" alt="Heart" />
          </button>
          <button class="thumb" data-add="sparkles">
            <img src="/stickers/Sparkles.svg" alt="Sparkles" />
          </button>
          <button class="thumb" data-add="zzz">
            <img src="/stickers/ZZZ.svg" alt="ZZZ" />
          </button>
          <button class="thumb" data-add="afk">
            <img src="/stickers/AFK.svg" alt="AFK" />
          </button>
      </div>
      </div>
  </div>
    <div class="loader-overlay hidden" style="pointer-events: none ;">
        <div class="spinner"></div>
    </div>

   <script type="module" src="/viewer.js"></script>

  </body>
</html>
